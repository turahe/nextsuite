version: '3.8'

services:
  # Development service
  nextsuite-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=${VITE_API_URL:-http://localhost:5000}
    command: npm run dev
    networks:
      - nextsuite-network
    restart: unless-stopped

  # Production service
  nextsuite-prod:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "80:80"
    environment:
      - NODE_ENV=production
    networks:
      - nextsuite-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Optional: Backend API service (uncomment if needed)
  # backend:
  #   image: your-backend-image:latest
  #   ports:
  #     - "5000:5000"
  #   environment:
  #     - NODE_ENV=production
  #     - DATABASE_URL=${DATABASE_URL}
  #   networks:
  #     - nextsuite-network
  #   restart: unless-stopped

networks:
  nextsuite-network:
    driver: bridge

volumes:
  node_modules: